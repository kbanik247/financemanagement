{% extends "base.html" %}{% block content %}<section class="panel narrow"><div class="eyebrow">LEDGER CORRECTION</div><h1>Edit transaction #{{t.id}}</h1><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><label>Date<input type="date" name="txn_date" value="{{t.txn_date}}" required></label><label>Type<select name="kind">{% for k in ['income','expense','investment_buy','investment_sell','transfer_in','transfer_out','adjustment'] %}<option value="{{k}}" {% if t.kind==k %}selected{% endif %}>{{k}}</option>{% endfor %}</select></label><label>Account<select name="account_id"><option value="">No account</option>{% for a in accounts %}<option value="{{a.id}}" {% if t.account_id==a.id %}selected{% endif %}>{{a.nickname}}</option>{% endfor %}</select></label><label>Category<input name="category" value="{{t.category}}"></label><label>Description<input name="description" value="{{t.description}}" required></label><label>Amount<input type="number" step="0.01" min="0.01" name="amount" value="{{t.amount}}" required></label><label>Status<select name="status"><option value="posted" {% if t.status=='posted' %}selected{% endif %}>Posted</option><option value="pending" {% if t.status=='pending' %}selected{% endif %}>Pending</option></select></label><label>Remarks<input name="remarks" value="{{t.remarks}}"></label><button class="primary">Update and recalculate</button></form></section>{% endblock %}
