{% extends "base.html" %}{% block content %}<section class="panel narrow"><div class="eyebrow">INTERNAL MOVEMENT</div><h1>Transfer between accounts</h1><p class="muted">A transfer produces paired entries and does not affect income, expenses or savings.</p><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><label>Date<input type="date" name="txn_date" required></label><label>From account<select name="from_account">{% for a in accounts %}<option value="{{a.id}}">{{a.nickname}}</option>{% endfor %}</select></label><label>To account<select name="to_account">{% for a in accounts %}<option value="{{a.id}}">{{a.nickname}}</option>{% endfor %}</select></label><label>Amount (₹)<input type="number" step="0.01" min="0.01" name="amount" required></label><label>Description<input name="description" value="Own-account transfer"></label><button class="primary">Record transfer</button></form></section>{% endblock %}
